<div class="navigation">
    <div class="navigation-logo">
        <h3>
            Watchlist for us
        </h3>
    </div>

    <nav class="navigation-container">
        <a routerLink="/" routerLinkActive="navigation--link-active" [routerLinkActiveOptions]="{ exact: true }"
            class="navigation--link">
            <img src="assets/icons/Star.svg" alt="" class="navigation--link-icon" />
            <span> Для тебя </span>
        </a>

        <a routerLink="/together" routerLinkActive="navigation--link-active" class="navigation--link">
            <img src="assets/icons/Users.svg" alt="" class="navigation--link-icon" />
            <span>Вместе</span>
        </a>

        <a routerLink="/popular" routerLinkActive="navigation--link-active" class="navigation--link">
            <img src="assets/icons/Trending up.svg" alt="" class="navigation--link-icon" />
            <span>Популярное</span>
        </a>

        <a routerLink="/moder" routerLinkActive="navigation--link-active" class="navigation--link">
            <img src="assets/icons/Star.svg" alt="" class="navigation--link-icon" />
            <span>Модерация</span>
        </a>

        <hr>

        <div class="navigation-footer">
            @if (authService.currentUser(); as user) {
            <a [routerLink]="`/users/${user.uuid}/friends`" routerLinkActive="navigation--link-active"
                class="navigation--link">
                Друзья
            </a>
            <a [routerLink]="['/users/', user.uuid]" routerLinkActive="navigation--link-active"
                class="navigation--link">
                {{ user.username }}
            </a>
            } @else {
            <a routerLink="/auth" routerLinkActive="navigation--link-active">
                Войти
            </a>
            }
        </div>
    </nav>
</div>
