<div class="navigation">
    <nav class="navigation-container">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Для тебя
        </a>

        <a routerLink="/together" routerLinkActive="active">
            Вместе
        </a>

        <a routerLink="/popular" routerLinkActive="active">
            Популярное
        </a>

        <a routerLink="/moder" routerLinkActive="active">
            Модерация
        </a>

        <div class="navigation-footer">
            @if (authService.currentUser(); as user) {
            <a [routerLink]="['/users/', user.uuid]" routerLinkActive="active">
                {{ user.username }}
            </a>
            } @else {
            <a routerLink="/auth" routerLinkActive="active">
                Войти
            </a>
            }
        </div>
    </nav>
</div>
