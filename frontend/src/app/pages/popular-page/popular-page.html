<div class="popular-page">
    <h1 class="popular-page__title">
        Популярное
    </h1>

    <p class="popular-page__description">
        Истории, которые обсуждают все.
    </p>

    <div class="popular-page__content">
        <div>
            <div style="margin-bottom: 20px;">
                <app-search (searchChange)="onSearchChange($event)" />
            </div>

            <div class="popular-page__movie-type-list">
                @for(type of movieTypes; track type){
                <div>{{type}}</div>
                }
            </div>

            <app-movie-list [movies]="movies()" [loading]="loading()" />
        </div>

        <app-filter-list />
    </div>


</div>
