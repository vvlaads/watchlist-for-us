<div class="for-you-page">
    <h1 class="for-you-page__title">
        Для тебя
    </h1>

    <p class="for-you-page__description">
        Подобрано для вас
    </p>

    <div class="for-you-page__content">
        <div>
            <div style="margin-bottom: 20px;">
                <app-search (searchChange)="onSearchChange($event)" />
            </div>
            <app-movie-list [movies]="movies()" [loading]="loading()" />
        </div>

        <app-filter-list />
    </div>
</div>
