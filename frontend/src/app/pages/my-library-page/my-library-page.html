<div class="my-library-page">
    <h1 class="my-library-page__title">
        Мои списки
    </h1>

    <p class="my-library-page__description">
        Твоя личная библиотека произведений
    </p>

    <app-category-selector [options]="listStatuses" [selected]="selectedStatus"
        (selectedChange)="selectListType($event)" />

    <app-search (searchChange)="onSearchChange($event)" />

    @if(loading()) {
    <app-loading />
    }
    @else {
    <app-movie-list [movies]="movies()" [loading]="loading()" />
    }

</div>
