<div class="together-page">


    <h1>Вместе</h1>

    <h2>Друзья</h2>
    <div class="together-page__friends-description">Выбери друзей, с которыми хочешь подобрать совпадения</div>

    <div class="together-page__friend-list">
        @if(friends.length > 0){
        @for (friend of friends; track friend.uuid){
        <div class="friend-card">
            {{friend.username}}
        </div>
        }
        } @else {
        <div class="together-page__empty-friend-list">
            У вас пока нет друзей

            <a class="button button--primary">
                Найти друзей
            </a>
        </div>
        }



    </div>
</div>
