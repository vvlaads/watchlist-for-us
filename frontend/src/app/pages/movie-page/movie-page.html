<div class="movie-page">
    @if (movie(); as currentMovie){
    <div class="movie-page__a">
        <img [src]="posterService.getPosterUrl(currentMovie.posterKey)" [alt]="currentMovie.name"
            class="movie-page__poster" />

    </div>

    <div class="movie-page__text">
        <h1>
            {{currentMovie.name}}
        </h1>
        <span>{{currentMovie.type}}</span>
        
        <div>
            {{currentMovie.description}}
        </div>
    </div>
    }
</div>
