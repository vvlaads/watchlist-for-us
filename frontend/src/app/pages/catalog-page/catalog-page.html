<div class="catalog-page">
    <h1 class="catalog-page__title">
        Каталог
    </h1>

    <p class="catalog-page__description">
        Найди, что посмотреть
    </p>

    <div class="catalog-page__content">
        <div>
            <div style="margin-bottom: 20px;">
                <app-search (searchChange)="onSearchChange($event)" />
            </div>

            <div style="margin-bottom: 20px;">
                <app-category-selector [options]="movieTypes" [selected]="selectedType"
                    (selectedChange)="selectedType = $event" />
            </div>

            <app-movie-list [movies]="movies()" [loading]="loading()" />
        </div>

        <app-filter-list />
    </div>
</div>
