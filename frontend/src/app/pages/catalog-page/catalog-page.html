<div class="catalog-page">
    <h1 class="catalog-page__title">Каталог</h1>
    <p class="catalog-page__description">Найди, что посмотреть</p>
    
    <div class="catalog-page__content">
        <div class="catalog-page__main">
            <div class="catalog-page__controls">
                <app-search (searchChange)="onSearchChange($event)" />

                <app-category-selector [options]="movieTypes" [selected]="selectedType()"
                    (selectedChange)="onTypeChange($event)" />
            </div>

            <app-movie-list [movies]="movies()" [loading]="loading()" [hasMore]="hasMore()"
                (columnsChange)="onColumnsChange($event)" (loadMore)="loadNextPage()" />
        </div>

        <app-filter-list />
    </div>
</div>
